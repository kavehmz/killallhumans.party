name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'workspace/preview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22.23.2-bookworm-slim
    defaults:
      run:
        working-directory: workspace/preview
    env:
      NEXT_PUBLIC_BASE_PATH: /killallhumans.party
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the static frontend
        run: npm run build
      - name: Prepare files for the GitHub project subdirectory
        run: |
          mv dist/client/killallhumans.party/_next dist/client/_next
          rmdir dist/client/killallhumans.party
          npm run check:static
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: workspace/preview/dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
