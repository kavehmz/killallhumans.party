services:
  preview:
    image: docker.io/library/node:22-bookworm-slim
    working_dir: /app
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
      - npm-cache:/root/.npm
    command: npm run dev -- --hostname 0.0.0.0 --port 4173
    environment:
      WRANGLER_SEND_METRICS: "false"
      CHOKIDAR_USEPOLLING: "true"
volumes:
  dependencies:
    external: true
    name: kah-preview-node-modules
  npm-cache:
    external: true
    name: kah-preview-npm-cache
